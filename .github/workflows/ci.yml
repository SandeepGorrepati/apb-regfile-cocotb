name: apb-regfile-cocotb
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install cocotb
        run: pip install -r requirements.txt
      - name: Check coverage gates and negative controls
        run: python -m unittest discover -s tb -p 'test_apb_checks.py' -v
      - name: Check mutation-result gates
        run: python -m unittest discover -s tb -p 'test_mutation_results.py' -v
      - name: Run verification
        run: python sim/runner.py
      - name: Require detection of actual RTL mutations
        run: python sim/check_mutations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apb-mutation-evidence
          path: sim/mutation_logs/
